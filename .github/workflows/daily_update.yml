name: Daily Bulgaria Wikidata Update

on:
  schedule:
    # 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # avvio manuale dalla scheda Actions
    inputs:
      region:
        description: 'Region key (es. plovdiv), più chiavi separate da virgola (plovdiv,varna) oppure all'
        default: 'all'

# un solo aggiornamento alla volta (evita conflitti nei commit)
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        # dopo 300 minuti non inizia nuove regioni, così resta il tempo per il commit
        run: python -u update.py --region "${{ github.event.inputs.region || 'all' }}" --max-minutes 300
        env:
          OVERPASS_URL: ${{ secrets.OVERPASS_URL }}

      - name: Commit and push
        # anche se lo script si interrompe, salva le regioni già completate
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatic update: OSM & Wikidata data"
          file_pattern: "osm/*.json data_overpass/*.geojson metadata.json history.json"
